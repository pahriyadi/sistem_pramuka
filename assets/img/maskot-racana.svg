<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5d3a00"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="hasduk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#mShadow)">
    <!-- Scout Hat (Baret / Topi Lapangan Pramuka) -->
    <ellipse cx="100" cy="55" rx="55" ry="18" fill="url(#hatGrad)"/>
    <path d="M60,50 Q100,20 140,50 Q100,45 60,50 Z" fill="#5d3a00"/>
    <!-- Hat Badge (Tanda Topi Kuning Emas) -->
    <circle cx="100" cy="42" r="7" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Head / Face -->
    <ellipse cx="100" cy="85" rx="35" ry="32" fill="#fed7aa"/>
    
    <!-- Cheerful Eyes -->
    <circle cx="88" cy="80" r="5" fill="#0b2545"/>
    <circle cx="112" cy="80" r="5" fill="#0b2545"/>
    <circle cx="90" cy="78" r="1.5" fill="#ffffff"/>
    <circle cx="114" cy="78" r="1.5" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M82,72 Q88,68 94,72" fill="none" stroke="#5d3a00" stroke-width="2" stroke-linecap="round"/>
    <path d="M106,72 Q112,68 118,72" fill="none" stroke="#5d3a00" stroke-width="2" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M90,92 Q100,104 110,92" fill="none" stroke="#800000" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="80" cy="90" r="4" fill="#fca5a5" opacity="0.6"/>
    <circle cx="120" cy="90" r="4" fill="#fca5a5" opacity="0.6"/>

    <!-- Scarf / Setangan Leher (Kacu Merah Putih) -->
    <polygon points="100,110 70,122 100,145 130,122" fill="url(#hasduk)" stroke="#5d3a00" stroke-width="1"/>
    <!-- Ring Hasduk (Rotan Kuning Emas) -->
    <rect x="94" y="118" width="12" height="7" rx="2" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>

    <!-- Scout Uniform Body -->
    <path d="M60,125 Q50,190 70,200 L130,200 Q150,190 140,125 Z" fill="#d97706" opacity="0.95"/>
    <!-- Pocket Badges -->
    <rect x="72" y="145" width="18" height="15" rx="2" fill="#5d3a00" opacity="0.4"/>
    <rect x="110" y="145" width="18" height="15" rx="2" fill="#5d3a00" opacity="0.4"/>
    <circle cx="119" cy="152" r="4" fill="#800000"/>

    <!-- Mascot Tag -->
    <rect x="50" y="210" width="100" height="24" rx="12" fill="#0b2545" stroke="#d97706" stroke-width="1.5"/>
    <text x="100" y="226" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#fbbf24" text-anchor="middle">SI PRAJA UNSA</text>
  </g>
</svg>
