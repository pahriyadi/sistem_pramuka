<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#5d3a00"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Activity Emblem Circular Badge -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="url(#actGrad)" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="33" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
    
    <!-- Tent & Campfire -->
    <!-- Tent -->
    <polygon points="40,16 64,56 16,56" fill="#0b2545" stroke="#fbbf24" stroke-width="1.5"/>
    <polygon points="40,16 48,56 32,56" fill="#800000"/>
    <polygon points="40,24 45,56 35,56" fill="#d97706"/>
    <!-- Fire logs -->
    <line x1="28" y1="64" x2="52" y2="64" stroke="#5d3a00" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="62" x2="50" y2="66" stroke="#5d3a00" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Flame -->
    <path d="M40,50 C44,55 46,60 40,64 C34,60 36,55 40,50 Z" fill="url(#flame)"/>
  </g>

  <!-- Typography -->
  <text x="100" y="34" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#800000">GIAT PRESTASI PENEGAK</text>
  <text x="100" y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#0b2545">KEMAH BHAKTI 2026</text>
  <text x="100" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#5d3a00">Se-Pulau Sumbawa &amp; NTB</text>

  <!-- Badge Tag -->
  <rect x="250" y="60" width="70" height="20" rx="10" fill="#d97706"/>
  <text x="285" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">OFFICIAL</text>
</svg>
